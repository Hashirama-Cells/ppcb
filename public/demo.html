<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeadBot Live Demo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header><strong id="biz">Loading…</strong><nav><a href="/">LeadBot</a></nav></header>
<main>
  <p id="demo-banner" class="banner" hidden></p>
  <p class="muted">You're a customer on this business's website. Fill in the form and the agent texts you back. The chat stands in for SMS.</p>
  <div class="grid">
    <form id="form" class="card">
      <h3>Request service</h3>
      <label for="name">Name</label><input id="name" name="name" required value="Jordan Lee">
      <label for="phone">Phone</label><input id="phone" name="phone" required value="(555) 010-7788">
      <label for="address">Address <span class="muted">(optional)</span></label><input id="address" name="address" autocomplete="street-address" placeholder="Street address for the visit">
      <label for="service">Service</label><select id="service" name="service"></select>
      <label for="message">What's going on?</label><textarea id="message" name="message" rows="3">Kitchen sink is draining really slowly.</textarea>
      <label class="consent"><input type="checkbox" name="smsConsent" value="true" checked> <span>I agree to receive text messages about my request from <span class="biz-name">this business</span>. Msg &amp; data rates may apply. Reply STOP to opt out.</span></label>
      <p><button class="btn" type="submit">Send</button></p>
    </form>
    <div class="card">
      <h3>Text messages</h3>
      <div id="chat" class="chat" aria-live="polite"></div>
      <form id="reply" class="row"><input id="text" placeholder="Reply…" autocomplete="off" disabled><button class="btn" disabled>Send</button></form>
    </div>
  </div>
</main>
<script>
const chat = document.getElementById("chat");
let leadId = null;
let api = null; // /api/b/<business>
function bubble(role, text) {
  const d = document.createElement("div");
  d.className = "bubble " + role; d.textContent = text;
  chat.append(d); chat.scrollTop = chat.scrollHeight;
}
async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "request failed");
  return data;
}
(async () => {
  const slug = new URLSearchParams(location.search).get("b") || (await (await fetch("/api/health")).json()).defaultBusiness;
  api = `/api/b/${encodeURIComponent(slug)}`;
  const r = await fetch(`${api}/business`);
  if (!r.ok) { document.getElementById("biz").textContent = "Unknown business: " + slug; return; }
  const b = await r.json();
  document.title = `${b.name} – LeadBot demo`;
  if (b.demo) {
    const banner = document.getElementById("demo-banner");
    banner.textContent = `Demo made to show ${b.name} how LeadBot would work for them. It isn't run by ${b.name}, and nothing here books a real appointment or sends a real text.`;
    banner.hidden = false;
  }
  document.getElementById("biz").textContent = b.name;
  document.querySelectorAll(".biz-name").forEach(el => el.textContent = b.name);
  const sel = document.getElementById("service");
  for (const s of b.services) { const o = document.createElement("option"); o.textContent = s.name; sel.append(o); }
  const msg = document.getElementById("message");
  msg.value = "";
  msg.placeholder = "Describe what you need";
})();
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!api) return;
  const body = Object.fromEntries(new FormData(e.target));
  body.smsConsent = body.smsConsent === "true";
  e.target.querySelector("button").disabled = true;
  bubble("lead", `(form sent: ${body.service})`);
  const t0 = performance.now();
  try {
    const { lead, reply } = await post(`${api}/leads`, body);
    leadId = lead.id;
    bubble("agent", reply);
    bubble("agent", `⏱ replied in ${((performance.now() - t0) / 1000).toFixed(1)}s`);
    document.querySelectorAll("#reply input, #reply button").forEach(el => el.disabled = false);
    document.getElementById("text").focus();
  } catch (err) { bubble("agent", "Error: " + err.message); e.target.querySelector("button").disabled = false; }
});
document.getElementById("reply").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("text");
  const text = input.value.trim(); if (!text || !leadId) return;
  input.value = ""; bubble("lead", text);
  try {
    const { reply } = await post(`${api}/leads/${leadId}/messages`, { text });
    if (reply) bubble("agent", reply);
  } catch (err) { bubble("agent", "Error: " + err.message); }
});
</script>
</body>
</html>
